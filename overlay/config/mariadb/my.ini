# Kiln - MariaDB configuration
# Paths and ports are NOT set here. Kiln passes them on the command line:
#   mariadbd.exe --defaults-file=<root>/config/mariadb/my.ini --datadir=<root>/data/mariadb
#                --port=3306 --bind-address=127.0.0.1 --log-error=<root>/logs/mariadb.err
# Command-line options override anything in this file.

[mysqld]
character-set-server     = utf8mb4
collation-server         = utf8mb4_unicode_ci
max_allowed_packet       = 64M
max_connections          = 100

# InnoDB - modest settings for a laptop
innodb_buffer_pool_size  = 256M
innodb_log_file_size     = 64M
innodb_flush_log_at_trx_commit = 2

# Log slow queries to help with development (file lives in the data dir)
slow_query_log           = 0
long_query_time          = 1

[client]
default-character-set    = utf8mb4

[mariadb-dump]
max_allowed_packet       = 64M
