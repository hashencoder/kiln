# WebHut - MariaDB configuration
# Paths and ports are NOT set here. WebHut passes them on the command line:
#   mariadbd.exe --defaults-file=<root>/config/mariadb/my.ini --datadir=<root>/data/mariadb
#                --port=3306 --bind-address=127.0.0.1 --log-error=<root>/logs/mariadb.err
# Command-line options override anything in this file.

[mysqld]
character-set-server     = utf8mb4
collation-server         = utf8mb4_unicode_ci
max_allowed_packet       = 64M
max_connections          = 100

# InnoDB - modest settings for a laptop
innodb_buffer_pool_size  = 256M
innodb_log_file_size     = 64M

# --- Crash safety (laptops lose power, batteries die) ---------------
# Every committed transaction is on disk before MariaDB says "OK", so a
# sudden power-off loses nothing that was committed. (A value of 2 is a
# little faster but can lose the last second of writes.)
innodb_flush_log_at_trx_commit = 1
# Write pages twice so a page half-written during a power cut can be repaired.
innodb_doublewrite       = 1
# Store each table in its own file; one damaged table doesn't take down the rest.
innodb_file_per_table    = 1
# Repair MariaDB's own Aria system tables automatically after a crash,
# keeping a backup of anything it changes.
aria_recover_options     = BACKUP,QUICK

# Log slow queries to help with development (file lives in the data dir)
slow_query_log           = 0
long_query_time          = 1

[client]
default-character-set    = utf8mb4

[mariadb-dump]
max_allowed_packet       = 64M
