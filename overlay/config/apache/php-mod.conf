# ServNook - PHP as an Apache module (default mode)
# Requires the x64 THREAD SAFE build of PHP.
# PHP_DIR is defined on the command line, e.g. C:/servnook/php/8.5

# Apache's bin folder also ships OpenSSL/nghttp2 DLLs with the same names as
# PHP's. Windows would pick Apache's copies first, which can break PHP's
# openssl/curl extensions, so load PHP's own copies up front.
<IfFile "${PHP_DIR}/libcrypto-3-x64.dll">
    LoadFile "${PHP_DIR}/libcrypto-3-x64.dll"
</IfFile>
<IfFile "${PHP_DIR}/libssl-3-x64.dll">
    LoadFile "${PHP_DIR}/libssl-3-x64.dll"
</IfFile>
<IfFile "${PHP_DIR}/nghttp2.dll">
    LoadFile "${PHP_DIR}/nghttp2.dll"
</IfFile>
<IfFile "${PHP_DIR}/libssh2.dll">
    LoadFile "${PHP_DIR}/libssh2.dll"
</IfFile>
<IfFile "${PHP_DIR}/libsqlite3.dll">
    LoadFile "${PHP_DIR}/libsqlite3.dll"
</IfFile>

LoadModule php_module "${PHP_DIR}/php8apache2_4.dll"
PHPIniDir "${PHP_DIR}"

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Never serve PHP source
<FilesMatch "\.phps$">
    Require all denied
</FilesMatch>
