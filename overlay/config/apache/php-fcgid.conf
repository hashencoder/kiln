# WebHut - PHP through mod_fcgid (advanced mode: different PHP version per site)
# Enabled when Apache is started with -C "Define WEBHUT_PHP_FCGID 1".
#
# Requires mod_fcgid.so in apache/modules (download it from the
# Apache Lounge "modules" section and match the Apache build).
# Each PHP folder needs php-cgi.exe. NTS (non thread safe) builds are
# recommended for FastCGI, but TS builds also work.
#
# php-cgi.exe finds the php.ini that sits next to it, so every PHP
# version folder uses its own php.ini automatically.

LoadModule fcgid_module modules/mod_fcgid.so

FcgidIOTimeout             300
FcgidConnectTimeout        20
FcgidMaxRequestLen         134217728
FcgidMaxRequestsPerProcess 1000
FcgidInitialEnv            PHP_FCGI_MAX_REQUESTS 1000
FcgidInitialEnv            WEBHUT_ROOT "${WEBHUT_ROOT}"

<FilesMatch "\.php$">
    SetHandler fcgid-script
</FilesMatch>

# Default PHP version for every site
FcgidWrapper "${PHP_DIR}/php-cgi.exe" .php

<Directory "${WEBHUT_ROOT}/www">
    Options +ExecCGI
</Directory>
<Directory "${WEBHUT_ROOT}/apps">
    Options +ExecCGI
</Directory>

