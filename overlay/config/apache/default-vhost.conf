# WebHut - default virtual host
# The FIRST vhost is also the fallback for any hostname that has no
# vhost of its own, so unknown *.localhost names land on the dashboard.

<VirtualHost *:${WEBHUT_HTTP_PORT}>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot "${WEBHUT_ROOT}/www"

    # phpMyAdmin only on http://localhost/phpmyadmin, not on every site
    Alias /phpmyadmin "${WEBHUT_ROOT}/apps/phpmyadmin"
    <Directory "${WEBHUT_ROOT}/apps/phpmyadmin">
        # ExecCGI is needed when PHP runs through mod_fcgid; harmless with mod_php.
        Options FollowSymLinks ExecCGI
        AllowOverride None
        Require local
    </Directory>

    # Adminer (MySQL, PostgreSQL, MariaDB) on http://localhost/adminer, this PC only
    <IfFile "${WEBHUT_ROOT}/apps/adminer/index.php">
        Alias /adminer "${WEBHUT_ROOT}/apps/adminer"
        <Directory "${WEBHUT_ROOT}/apps/adminer">
            Options FollowSymLinks ExecCGI
            AllowOverride None
            DirectoryIndex index.php
            Require local
        </Directory>
    </IfFile>
</VirtualHost>
