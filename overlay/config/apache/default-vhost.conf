# ServNook - default virtual host
# The FIRST vhost is also the fallback for any hostname that has no
# vhost of its own, so unknown *.localhost names land on the dashboard.

<VirtualHost *:${SERVNOOK_HTTP_PORT}>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot "${SERVNOOK_ROOT}/www"

    # phpMyAdmin only on http://localhost/phpmyadmin, not on every site
    Alias /phpmyadmin "${SERVNOOK_ROOT}/apps/phpmyadmin"
    <Directory "${SERVNOOK_ROOT}/apps/phpmyadmin">
        # ExecCGI is needed when PHP runs through mod_fcgid; harmless with mod_php.
        Options FollowSymLinks ExecCGI
        AllowOverride None
        Require local
    </Directory>

    # Adminer (MySQL, PostgreSQL, MariaDB) on http://localhost/adminer, this PC only
    <IfFile "${SERVNOOK_ROOT}/apps/adminer/index.php">
        Alias /adminer "${SERVNOOK_ROOT}/apps/adminer"
        <Directory "${SERVNOOK_ROOT}/apps/adminer">
            Options FollowSymLinks ExecCGI
            AllowOverride None
            DirectoryIndex index.php
            Require local
        </Directory>
    </IfFile>
</VirtualHost>
