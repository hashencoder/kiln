name: Database engines (Windows integration)

# Real end-to-end test of the optional engines on Windows: official downloads, first start
# (data folder created), a query, clean stop, second start on the existing data, and Adminer
# logging in to MySQL and PostgreSQL through Apache. Results are also posted as annotations.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build/build.ps1

      - name: Core setup (whut setup)
        run: |
          New-Item -ItemType Directory C:\WH -Force | Out-Null
          Copy-Item dist\WebHut.exe, dist\whut.exe, dist\*.config C:\WH
          Set-Location C:\WH
          $out = .\whut.exe setup 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE) { Write-Output "::error title=core setup::$($out -replace "`r?`n", ' | ')"; exit 1 }
          Write-Output "::notice title=core setup::ok"

      - name: Probe MySQL download hosts (diagnostic)
        continue-on-error: true
        run: |
          foreach ($p in 6..14) {
            foreach ($u in "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.$p-winx64.zip", "https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.$p-winx64.zip", "https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-8.4.$p-winx64.zip") {
              try { $r = Invoke-WebRequest $u -Method Head -UseBasicParsing -MaximumRedirection 5; $code = [int]$r.StatusCode; $ct = $r.Headers['Content-Type'] } catch { $code = $_.Exception.Response.StatusCode.value__; $ct = "" }
              if ($code -eq 200) { Write-Output "::notice title=mysql probe::$code $ct $u" }
            }
          }

      - name: Add MySQL, PostgreSQL, MongoDB, mongosh, Adminer
        run: |
          Set-Location C:\WH
          $out = .\whut.exe install mysql postgresql mongodb mongosh adminer 2>&1 | Out-String
          Write-Host $out
          foreach ($l in ($out -split "`r?`n" | Where-Object { $_ -match '^(MySQL|PostgreSQL|MongoDB|Adminer) ' })) { Write-Output "::notice title=resolved::$l" }
          if ($LASTEXITCODE) { Write-Output "::error title=install::$($out -replace "`r?`n", ' | ')"; exit 1 }

      - name: Start, query, stop, start again (each engine)
        timeout-minutes: 25
        run: |
          Set-Location C:\WH
          # Every whut call: own time limit, output to files (so nothing can hang on a pipe).
          function W([string]$a, [int]$t = 300) {
            $o = "C:\WH\w-out.txt"; $e = "C:\WH\w-err.txt"
            $p = Start-Process .\whut.exe -ArgumentList $a -PassThru -NoNewWindow -RedirectStandardOutput $o -RedirectStandardError $e -WorkingDirectory C:\WH
            $null = $p.Handle
            $done = $p.WaitForExit($t * 1000)
            $txt = ((Get-Content $o -Raw) + " " + (Get-Content $e -Raw)) -replace "`r?`n", ' | '
            if (-not $done) { try { $p.Kill() } catch {} ; return @{ code = 999; out = "TIMEOUT after $t s: $txt" } }
            return @{ code = $p.ExitCode; out = $txt }
          }
          function Logs($e) { (Get-ChildItem logs | Where-Object { $_.Name -match $e } | ForEach-Object { Get-Content $_.FullName -Tail 25 } | Out-String) -replace "`r?`n", ' | ' }
          $failed = 0
          foreach ($e in "mysql", "postgresql", "mongodb") {
            foreach ($round in 1, 2) {
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $r = W "start $e" 420
              if ($r.code -ne 0) { Write-Output "::error title=$e start $round::$($r.out) LOG: $(Logs $e)"; $failed++; W "stop $e" 120 | Out-Null; break }
              Write-Output "::notice title=$e start $round::$([int]$sw.Elapsed.TotalSeconds) s"
              $q = W "check-db $e" 120
              if ($q.code -ne 0) { Write-Output "::error title=$e query $round::$($q.out)"; $failed++ }
              else { Write-Output "::notice title=$e query $round::$($q.out)" }
              $st = W "stop $e" 180
              if ($st.code -ne 0 -or $st.out -match "didn't stop cleanly") { Write-Output "::warning title=$e stop $round::$($st.out)" }
            }
          }
          if ($failed) { exit 1 }

      - name: whut start piped into another command returns (no inherited handles)
        timeout-minutes: 6
        run: |
          Set-Location C:\WH
          $job = Start-Job { Set-Location C:\WH; .\whut.exe start mysql 2>&1 | Out-String }
          if (Wait-Job $job -Timeout 240) { Write-Output "::notice title=piped start::returned: $((Receive-Job $job) -replace "`r?`n", ' | ')" }
          else { Write-Output "::error title=piped start::'whut start mysql | Out-String' did not return within 240 s"; Stop-Job $job; .\whut.exe stop mysql; exit 1 }
          .\whut.exe stop mysql

      - name: Adminer logs in to MySQL and PostgreSQL through Apache
        timeout-minutes: 15
        run: |
          Set-Location C:\WH
          foreach ($svc in "apache", "mysql", "postgresql") { .\whut.exe start $svc; if ($LASTEXITCODE) { Write-Output "::error title=adminer::couldn't start $svc"; exit 1 } }
          $failed = 0
          foreach ($t in @(@{ driver = "server"; server = "127.0.0.1:3307"; user = "root"; expect = "information_schema" },
                           @{ driver = "pgsql";  server = "127.0.0.1:5432"; user = "postgres"; expect = "postgres" })) {
            try {
              $r = Invoke-WebRequest "http://localhost/adminer/" -SessionVariable web -UseBasicParsing
              $body = @{ "auth[driver]" = $t.driver; "auth[server]" = $t.server; "auth[username]" = $t.user; "auth[password]" = ""; "auth[db]" = "" }
              $r = Invoke-WebRequest "http://localhost/adminer/" -Method Post -Body $body -WebSession $web -UseBasicParsing -MaximumRedirection 5
              $ok = $r.Content -match "Logout" -and $r.Content -match $t.expect
              if ($ok) { Write-Output "::notice title=adminer $($t.driver)::logged in, sees $($t.expect)" }
              else {
                $text = ($r.Content -replace '<[^>]+>', ' ' -replace '\s+', ' ')
                Write-Output "::error title=adminer $($t.driver)::login page did not show databases: $($text.Substring(0, [Math]::Min(600, $text.Length)))"; $failed++
              }
            } catch { Write-Output "::error title=adminer $($t.driver)::$($_.Exception.Message)"; $failed++ }
          }
          .\whut.exe stop all
          if ($failed) { exit 1 }

      - name: Logs on failure
        if: failure()
        run: |
          Get-ChildItem C:\WH\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "==== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
